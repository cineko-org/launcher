name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.0.2
      - name: Configure Ubuntu package mirror
        run: bash scripts/configure-ubuntu-mirror.sh
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: frontend
      - run: make check

  release-metadata:
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate generated release metadata
        run: bash scripts/verify-release-metadata.sh
