name: macOS Activation

on:
  pull_request:
    paths:
      - main.go
      - internal/desktop/**
      - internal/launcher/**
      - scripts/test-macos-activation.m
      - scripts/test-macos-client-handoff.m
      - .github/workflows/macos-activation.yml

permissions:
  contents: read

jobs:
  activation:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go activation routing and child lifecycle on macOS
        run: go test -mod=vendor -race ./internal/desktop ./internal/launcher
      - name: Test native activation event wiring
        run: |
          clang -fblocks -framework Cocoa scripts/test-macos-activation.m -o "$RUNNER_TEMP/cineko-activation-test"
          "$RUNNER_TEMP/cineko-activation-test"
      - name: Check out the paired Client activation implementation
        uses: actions/checkout@v7
        with:
          repository: cineko-org/client
          ref: c1284d5731f8bd61c369c14494071e0ea43daad3
          path: build/activation-client
          persist-credentials: false
      - name: Test real activation between separate processes
        run: |
          clang -fblocks -framework Cocoa scripts/test-macos-client-handoff.m \
            internal/desktop/activation_darwin.m build/activation-client/desktop_activation_darwin.m \
            -o "$RUNNER_TEMP/cineko-handoff-test"
          "$RUNNER_TEMP/cineko-handoff-test"
