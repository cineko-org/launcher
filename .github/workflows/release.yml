name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    if: needs.release.outputs.created == 'true'
    needs: release
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            wails_platform: darwin/arm64
          - platform: windows-amd64
            runner: windows-2025
            wails_platform: windows/amd64
          - platform: linux-amd64
            runner: ubuntu-24.04
            wails_platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CENTRAL_URL: ${{ secrets.CINEKO_CENTRAL_URL }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require the Central endpoint
        shell: bash
        run: test -n "$CENTRAL_URL"
      - name: Configure Ubuntu package mirror
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: bash scripts/configure-ubuntu-mirror.sh
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file libgtk-3-dev libwebkit2gtk-4.1-dev patchelf
      - name: Install frontend dependencies
        shell: bash
        run: |
          npm install --global npm@12.0.2
          npm ci --prefix frontend
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build Launcher
        shell: bash
        run: |
          tags=()
          if [[ "${{ matrix.platform }}" == "linux-amd64" ]]; then
            tags=(-tags webkit2_41)
          fi
          "$(go env GOPATH)/bin/wails" build \
            -clean -trimpath -m -nosyncgomod \
            -platform "${{ matrix.wails_platform }}" \
            "${tags[@]}" \
            -ldflags "-s -w -X main.launcherVersion=$VERSION -X main.launcherCentralURL=$CENTRAL_URL"
      - name: Package macOS Launcher
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            'build/bin/Cineko Launcher.app' \
            "build/release/cineko-launcher-v${VERSION}-darwin-arm64.zip"
      - name: Package Windows Launcher
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          mkdir -p build/release
          cp 'build/bin/Cineko Launcher.exe' \
            "build/release/cineko-launcher-v${VERSION}-windows-amd64.exe"
      - name: Package Linux Launcher
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          scripts/package-linux-appimage.sh \
            "$VERSION" "$source_date_epoch" \
            'build/bin/Cineko Launcher' \
            "build/release/cineko-launcher-v${VERSION}-linux-amd64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.platform }}
          path: build/release/cineko-launcher-v${{ needs.release.outputs.version }}-*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: needs.release.outputs.created == 'true'
    needs:
      - release
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CINEKO_CENTRAL_URL: ${{ secrets.CINEKO_CENTRAL_URL }}
      CINEKO_RELEASE_PUBLISH_TOKEN: ${{ secrets.CINEKO_RELEASE_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum cineko-launcher-* > SHA256SUMS
      - name: Attach portable Launchers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ needs.release.outputs.tag }}"
          release-assets/cineko-launcher-*
          release-assets/SHA256SUMS
          --repo "${{ github.repository }}"
      - name: Register the stable Launcher set
        env:
          CINEKO_LAUNCHER_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag }}
        run: |
          published_at="$(date --utc --date="@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          scripts/register-launcher-release.sh \
            "${{ needs.release.outputs.version }}" \
            "$published_at" \
            release-assets
