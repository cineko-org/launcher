name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    if: needs.release.outputs.created == 'true'
    needs: release
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            wails_platform: darwin/arm64
          - platform: windows-amd64
            runner: windows-2025
            wails_platform: windows/amd64
          - platform: linux-amd64
            runner: ubuntu-24.04
            wails_platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Ubuntu package mirror
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: bash scripts/configure-ubuntu-mirror.sh
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file libgtk-3-dev libwebkit2gtk-4.1-dev patchelf
      - name: Install frontend dependencies
        shell: bash
        run: |
          npm install --global npm@12.0.2
          npm ci --prefix frontend
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build Launcher
        shell: bash
        run: |
          tags=()
          if [[ "${{ matrix.platform }}" == "linux-amd64" ]]; then
            tags=(-tags webkit2_41)
          fi
          "$(go env GOPATH)/bin/wails" build \
            -clean -trimpath -m -nosyncgomod \
            -platform "${{ matrix.wails_platform }}" \
            "${tags[@]}" \
            -ldflags "-s -w -X main.launcherVersion=$VERSION"
      - name: Check out the pinned DMG layout tool
        if: matrix.platform == 'darwin-arm64'
        uses: actions/checkout@v7
        with:
          repository: create-dmg/create-dmg
          ref: a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f # v1.3.0
          path: build/tools/create-dmg
          persist-credentials: false
      - name: Sign, notarize, and package macOS Launcher
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_TIMEOUT: 10m
          CREATE_DMG: build/tools/create-dmg/create-dmg
        run: |
          scripts/sign-notarize-macos-launcher.sh \
            'build/bin/Cineko Launcher.app' \
            "build/release/cineko-launcher-v${VERSION}-darwin-arm64.dmg"
      - name: Package Windows Launcher
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          mkdir -p build/release
          cp 'build/bin/Cineko Launcher.exe' \
            "build/release/cineko-launcher-v${VERSION}-windows-amd64.exe"
      - name: Package Linux Launcher
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          scripts/package-linux-appimage.sh \
            "$VERSION" "$source_date_epoch" \
            'build/bin/Cineko Launcher' \
            "build/release/cineko-launcher-v${VERSION}-linux-amd64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.platform }}
          path: build/release/cineko-launcher-v${{ needs.release.outputs.version }}-*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: needs.release.outputs.created == 'true'
    needs:
      - release
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      CINEKO_LAUNCHER_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag }}
      CINEKO_RELEASE_PAYLOAD_OUT: release-assets/launcher-release-set.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true
      - name: Require an unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view '${{ needs.release.outputs.tag }}' \
            --repo '${{ github.repository }}' \
            --json isDraft \
            --jq .isDraft)" = true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum cineko-launcher-* > SHA256SUMS
      - name: Generate the Launcher update manifests
        shell: bash
        run: |
          published_at="$(git show -s --format=%cI HEAD)"
          scripts/register-launcher-release.sh "$VERSION" "$published_at" release-assets
          scripts/publish-launcher-release.sh "$CINEKO_RELEASE_PAYLOAD_OUT" release-assets
      - name: Attach portable Launchers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ needs.release.outputs.tag }}"
          release-assets/cineko-launcher-*
          release-assets/SHA256SUMS
          release-assets/launcher-release-set.json
          release-assets/launcher-darwin-arm64.json
          release-assets/launcher-linux-amd64.json
          release-assets/launcher-windows-amd64.json
          --repo "${{ github.repository }}"
      - name: Publish the complete portable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit
          "${{ needs.release.outputs.tag }}"
          --repo "${{ github.repository }}"
          --draft=false
          --latest
